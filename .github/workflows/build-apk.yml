name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon

      - name: Upload universal APK (works on all phones)
        uses: actions/upload-artifact@v4
        with:
          name: HDDownloader-universal
          path: app/build/outputs/apk/debug/*universal*.apk

      - name: Upload arm64 APK (smaller, for most modern phones)
        uses: actions/upload-artifact@v4
        with:
          name: HDDownloader-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
